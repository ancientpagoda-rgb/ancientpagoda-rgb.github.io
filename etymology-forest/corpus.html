<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#040806"><title>Etymology Forest — Full Corpus</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#040806;color:#eef8f0;font-family:system-ui,-apple-system,sans-serif}.top{position:fixed;z-index:50;top:max(8px,env(safe-area-inset-top));left:10px;right:10px;display:flex;gap:7px;align-items:center}.back{height:46px;min-width:52px;border:1px solid #8fb7d43d;border-radius:13px;background:#122331;color:#dceefa;font:700 12px system-ui}.search{display:flex;flex:1;gap:6px;padding:5px;border:1px solid #8fb7d43d;border-radius:14px;background:#071019f7;box-shadow:0 10px 30px #0009}.search input{min-width:0;flex:1;height:44px;border:1px solid #8fb7d42e;border-radius:10px;background:#0b1721;color:#eef8ff;padding:0 12px;font:16px system-ui;outline:none}.search button{height:44px;min-width:58px;border:1px solid #8fb7d44d;border-radius:10px;background:#24485f;color:#eef8ff;font:700 11px system-ui}.btns{display:none}.status{position:fixed;z-index:30;left:12px;right:12px;top:calc(max(8px,env(safe-area-inset-top)) + 62px);padding:6px 9px;border-radius:10px;border:1px solid #8fb7d422;background:#071019d9;color:#9db7c9;font:9px system-ui;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.panel{position:fixed;z-index:45;left:10px;right:10px;bottom:calc(max(10px,env(safe-area-inset-bottom)) + 4px);max-height:38dvh;overflow:auto;padding:14px;border:1px solid #8fb7d42a;border-radius:18px;background:#071019f4;box-shadow:0 10px 34px #000b;display:none}.panel h2{margin:2px 0 8px;font:700 24px Georgia,serif}.panel p,.panel .meta{font-size:11px;line-height:1.45;color:#aebfca}.panel .eye{font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:#86a8bd}.panel.open{display:block}body.bulk-world .bulk-chip{top:calc(max(8px,env(safe-area-inset-top)) + 94px)!important;left:12px!important;right:12px!important;font-size:8px!important;padding:6px 8px!important;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bulk-results{top:calc(max(8px,env(safe-area-inset-top)) + 126px)!important;max-height:48dvh!important}.bulk-key{display:none!important}#bulkBtn{display:none!important}.bulk-progress{z-index:80!important}.hint{position:fixed;z-index:20;left:50%;top:45%;transform:translate(-50%,-50%);width:min(330px,82vw);text-align:center;color:#7892a3;font:12px/1.5 system-ui;pointer-events:none}.hint b{display:block;margin-bottom:6px;color:#cde5f5;font:700 18px Georgia,serif}@media(orientation:landscape) and (max-height:500px){.panel{left:auto;width:330px;top:78px;bottom:10px;max-height:none}.hint{top:52%}}</style></head><body><div class="top"><button class="back" id="back">← Forest</button><div class="search"><input id="q" type="search" inputmode="search" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="Search 2.4M words…"><button id="go">Search</button></div><div class="btns"></div></div><div class="status">loading corpus…</div><div class="hint" id="hint"><b>Full Etymology Corpus</b>Search a word, then choose the language entry you want.</div><div class="panel"></div><script>function toast(s){const x=document.querySelector('.status');if(x)x.textContent=s}document.getElementById('back').onclick=()=>location.href='./?v=corpus-back';new MutationObserver(()=>{const p=document.querySelector('.panel');if(p&&p.querySelector('h2'))p.classList.add('open')}).observe(document.querySelector('.panel'),{childList:true,subtree:true});</script><script src="./phase7-bulk-corpus.js?v=standalone1"></script><script>(async()=>{if(!window.__bulkCorpus){toast('Corpus module failed to load');return}document.body.classList.add('bulk-world');window.__bulkCorpus.activate(true);const ok=await window.__bulkCorpus.load();if(ok){document.getElementById('hint').style.display='block';document.getElementById('q').focus()}})();</script></body></html>
