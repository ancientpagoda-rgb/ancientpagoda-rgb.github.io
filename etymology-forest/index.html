<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050b07"><title>Etymology Forest</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050b07;color:#edf7ef;font-family:system-ui,-apple-system,Segoe UI,sans-serif}canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}.glass{background:#07130bdc;border:1px solid #bcefc024;box-shadow:0 12px 34px #0008;backdrop-filter:blur(12px)}.top{position:fixed;z-index:3;top:12px;left:12px;right:12px;display:flex;gap:7px;align-items:center;pointer-events:none}.brand,.search,.buttons{pointer-events:auto}.brand{padding:10px 13px;border-radius:15px;white-space:nowrap}.brand b{font-size:13px;letter-spacing:.12em}.brand small{display:block;color:#91a898;font-size:9px}.search{display:flex;flex:1;max-width:620px;padding:6px;border-radius:15px}.search input{min-width:0;flex:1;background:0;border:0;outline:0;color:#fff;padding:7px;font-size:14px}.search button,.buttons button{border:1px solid #bcefc02d;background:#17331f;color:#edf7ef;border-radius:10px;padding:8px 11px}.buttons{display:flex;gap:6px;margin-left:auto}.status{position:fixed;z-index:3;top:76px;left:14px;padding:8px 11px;border-radius:12px;font-size:10px;color:#a8c2ae;text-transform:uppercase}.panel{position:fixed;z-index:3;right:14px;bottom:14px;width:min(360px,calc(100vw - 28px));padding:14px;border-radius:17px}.panel h2{font:500 28px Georgia,serif;margin:4px 0}.panel p{font-size:12px;line-height:1.45;color:#bfd1c3}.meta{font-size:10px;color:#91a898;border-top:1px solid #bcefc01c;padding-top:7px}.toast{position:fixed;z-index:4;left:50%;bottom:30px;transform:translateX(-50%);padding:8px 12px;border-radius:11px;opacity:0;transition:.2s}@media(max-width:760px){.top{flex-wrap:wrap}.brand{flex:1}.brand small{display:none}.search{order:3;flex-basis:100%;max-width:none}.search input{font-size:16px}.buttons button:first-child{display:none}.status{top:105px}.panel{left:10px;right:10px;bottom:10px;width:auto;max-height:30vh;overflow:auto}}
</style></head><body><canvas id="c"></canvas><div class="top"><div class="brand glass"><b>ETYMOLOGY FOREST</b><small>English words as a historical landscape</small></div><div class="search glass"><input id="q" placeholder="Search an English word…"><button id="go">Go</button></div><div class="buttons"><button id="overview">Overview</button><button id="home">Window</button></div></div><div id="status" class="status glass">booting…</div><div id="panel" class="panel glass"></div><div id="toast" class="toast glass"></div><script>
const c=document.querySelector('#c'),x=c.getContext('2d'),statusEl=document.querySelector('#status'),panelEl=document.querySelector('#panel');let W,H,D;
window.addEventListener('error',e=>statusEl.textContent='ERROR · '+(e.message||'startup failed'));
function resize(){W=innerWidth;H=innerHeight;D=Math.min(devicePixelRatio||1,2);c.width=W*D;c.height=H*D;x.setTransform(D,0,0,D,0,0)}resize();addEventListener('resize',resize);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),hash=s=>{let h=2166136261;for(const q of s)h=Math.imul(h^q.charCodeAt(0),16777619);return h>>>0};
const reg=[['GERMANIC',-900,450,1050,720,'#426f52'],['ROMANCE / LATIN',1000,350,950,700,'#835849'],['GREEK / SCIENCE',450,1450,850,560,'#5c6798'],['BORROWINGS',2350,750,900,700,'#846f49']].map((r,i)=>({id:i,n:r[0],x:r[1],y:r[2],rx:r[3],ry:r[4],c:r[5]}));
const nodes=[],A=(id,w,l,m,X,Y,p=[])=>nodes.push({id,w,l,m,x:X,y:Y,p});
A('pie2','*dwóh₁','Proto-Indo-European','two',-1250,760);A('pg2','*twai','Proto-Germanic','two',-1150,550,['pie2']);A('oe2','twā','Old English','two',-1080,320,['pg2']);A('two','two','English','the number 2',-1000,80,['oe2']);
A('wind','*windaz','Proto-Germanic','wind',-760,800);A('eye','*augô','Proto-Germanic','eye',-570,790);A('vind','vindauga','Old Norse','wind-eye; window',-650,520,['wind','eye']);A('winme','windowe','Middle English','window',-570,290,['vind']);A('window','window','English','opening in a wall fitted with glass',-500,30,['winme']);
A('mati','*matiz','Proto-Germanic','food',-1850,650);A('mete','mete','Old English','food in general',-1770,410,['mati']);A('meat','meat','English','animal flesh used as food',-1690,90,['mete']);
A('agiz','*agiz','Proto-Germanic','fear / terror',-1450,650);A('ege','ege','Old English','fear; terror',-1380,410,['agiz']);A('awe','awe','English','reverential fear or wonder',-1310,190,['ege']);A('awful','awful','English','very bad; historically full of awe',-1240,-30,['awe']);
A('pie-do','*deh₃-','Proto-Indo-European','give',250,750);A('do','dō','Latin','I give',330,560,['pie-do']);A('datum','datum','Latin','a thing given',400,340,['do']);A('data','data','English','facts or information',470,90,['datum']);
A('putare','putāre','Latin','to reckon / consider',780,710);A('computare','computāre','Latin','to calculate',860,480,['putare']);A('compute','compute','English','calculate',940,280,['computare']);A('computer','computer','English','calculating machine',1020,40,['compute']);
A('bios','βίος','Greek','life',200,1340);A('logos','λόγος','Greek','word / study',430,1340);A('biology','biology','English','study of life',315,1610,['bios','logos']);
A('jabr','al-jabr','Arabic','restoration',2150,520);A('algebra','algebra','English','branch of mathematics',2250,250,['jabr']);A('robota','robota','Czech','forced labor',2700,540);A('robot','robot','English','artificial worker',2790,270,['robota']);A('avatar0','avatāra','Sanskrit','descent / incarnation',2400,1180);A('avatar','avatar','English','incarnation; digital persona',2490,940,['avatar0']);A('sushi0','寿司 / すし','Japanese','sushi',3050,1080);A('sushi','sushi','English','Japanese rice dish',3130,840,['sushi0']);
const by=Object.fromEntries(nodes.map(n=>[n.id,n]));let cam={x:700,y:650,z:.28},target={...cam},selected=by.window,canopy=[],index=new Map(),source='built-in words';
const words=`the of and to a in is that for it on with as are was be by this from at or an have not but they you we one two three time year day people world life hand eye house water fire earth air sun moon star night light word language english history book science art music love fear war peace king queen city town country road river sea tree forest animal plant food work money law school family friend home computer data internet code system machine robot biology physics chemistry medicine market trade government mind body heart head name place thing number group power change old new good bad great small big long short high low first last right left north south east west before after under over through between around into out up down more less many few most some any all no yes make get give take see know think say tell ask use find look come go run walk live die grow build create learn read write speak play buy sell pay help keep move turn open close start stop true false real human social culture memory future past today tomorrow yesterday window meat awe awful algebra avatar sushi biology`.split(' ');
function regionFor(w){if(/bio|geo|astro|logy$|graph|physics|chem/.test(w))return reg[2];if(/algebra|robot|avatar|sushi|yoga|karma/.test(w))return reg[3];if(/tion$|ment$|ity$|ous$|ance$|ence$|ive$|ic$|age$/.test(w))return reg[1];return reg[0]}
function build(ws,label){const seen=new Set(),a=[];ws.forEach((v,i)=>{v=(v||'').trim().toLowerCase();if(!/^[a-z][a-z'-]{1,23}$/.test(v)||seen.has(v))return;seen.add(v);const r=regionFor(v),h=hash(v),ang=(h%100000)/100000*Math.PI*2,rr=Math.sqrt(((h>>>8)%10000)/10000);a.push({w:v,x:r.x+Math.cos(ang)*r.rx*rr*.92,y:r.y+Math.sin(ang)*r.ry*rr*.92,r})});canopy=a;index=new Map(a.map(n=>[n.w,n]));source=label;updateStatus()}
function updateStatus(){const view=cam.z<.34?'continent':cam.z<.72?'forest':cam.z<1.2?'tree':'word';statusEl.textContent=`${view} · ${Math.round(cam.z*100)}% · ${canopy.length.toLocaleString()} words · ${source}`}
function toast(s){const e=document.querySelector('#toast');e.textContent=s;e.style.opacity=1;clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.opacity=0,1600)}
function panel(n=selected){if(!n)return;panelEl.innerHTML=`<div style="font-size:9px;letter-spacing:.14em;color:#82a58a;text-transform:uppercase">${n.id?'etymology tree':'lexical canopy'}</div><h2>${n.w}</h2><p>${n.l?n.l+' · ':''}${n.m||'Common English word. Approximate biome placement until its etymology is expanded.'}</p><div class="meta">${n.id?'Follow the bright branches backward through time.':'Source: '+source}</div>`}
build(words,'built-in fallback');panel();setInterval(updateStatus,500);
fetch('https://raw.githubusercontent.com/parker57/making-sense-of-etymwn/refs/heads/master/google-10k.txt').then(r=>r.ok?r.text():Promise.reject()).then(t=>{const a=t.split(String.fromCharCode(10));if(a.length>5000){build(a,'10,000-word canopy');toast('Loaded 10,000-word canopy')}}).catch(()=>{});
const sx=v=>(v-cam.x)*cam.z+W/2,sy=v=>(v-cam.y)*cam.z+H/2,wx=v=>(v-W/2)/cam.z+cam.x,wy=v=>(v-H/2)/cam.z+cam.y,vis=(X,Y,p=50)=>sx(X)>-p&&sx(X)<W+p&&sy(Y)>-p&&sy(Y)<H+p;
function draw(){requestAnimationFrame(draw);cam.x+=(target.x-cam.x)*.09;cam.y+=(target.y-cam.y)*.09;cam.z+=(target.z-cam.z)*.1;x.clearRect(0,0,W,H);x.fillStyle='#050b07';x.fillRect(0,0,W,H);for(const r of reg){x.globalAlpha=.13;x.fillStyle=r.c;x.beginPath();x.ellipse(sx(r.x),sy(r.y),r.rx*cam.z,r.ry*cam.z,0,0,7);x.fill();if(cam.z<.62){x.globalAlpha=.6;x.fillStyle='#b8cdbd';x.font='600 15px system-ui';x.textAlign='center';x.fillText(r.n,sx(r.x),sy(r.y))}}x.globalAlpha=1;const step=cam.z<.3?5:cam.z<.5?2:1;let labels=0;for(let i=0;i<canopy.length;i+=step){const n=canopy[i];if(!vis(n.x,n.y,20))continue;const X=sx(n.x),Y=sy(n.y);x.globalAlpha=cam.z<.45?.18:.32;x.fillStyle='#d5ffd5';x.fillRect(X,Y,cam.z>.7?2:1,cam.z>.7?2:1);if(cam.z>1.3&&labels++<150){x.globalAlpha=.58;x.font='10px system-ui';x.textAlign='center';x.fillText(n.w,X,Y-4)}}x.globalAlpha=1;for(const n of nodes)for(const p of n.p){const a=by[p];if(!a||(!vis(n.x,n.y,100)&&!vis(a.x,a.y,100)))continue;const X1=sx(a.x),Y1=sy(a.y),X2=sx(n.x),Y2=sy(n.y),m=(X1+X2)/2;x.beginPath();x.moveTo(X1,Y1);x.bezierCurveTo(m,Y1,m,Y2,X2,Y2);x.strokeStyle='#b0d3b759';x.stroke()}for(const n of nodes){if(!vis(n.x,n.y,80))continue;const X=sx(n.x),Y=sy(n.y),sel=n===selected;x.fillStyle=sel?'#effff0':'#9dd2a5';x.beginPath();x.arc(X,Y,sel?7:4,0,7);x.fill();if(cam.z>.45||sel){x.fillStyle='#eff8f0';x.font=(sel?'700 ':'600 ')+'12px Georgia';x.textAlign='center';x.fillText(n.w,X,Y-10)}}}draw();
function choose(n){selected=n;target.x=n.x;target.y=n.y-60;target.z=Math.max(target.z,1.05);panel(n)}function chooseCan(n){selected=null;target.x=n.x;target.y=n.y;target.z=Math.max(target.z,1.3);panel({w:n.w});}
function search(){const q=document.querySelector('#q').value.trim().toLowerCase();if(!q)return;const n=nodes.find(n=>n.w.toLowerCase()===q);if(n)return choose(n);const k=index.get(q)||canopy.find(n=>n.w.startsWith(q));k?chooseCan(k):toast('Word not loaded yet')}
document.querySelector('#go').onclick=search;document.querySelector('#q').onkeydown=e=>e.key==='Enter'&&search();document.querySelector('#overview').onclick=()=>target={x:700,y:650,z:.25};document.querySelector('#home').onclick=()=>choose(by.window);
let drag=false,last=null,moved=false;c.onpointerdown=e=>{drag=true;moved=false;last={x:e.clientX,y:e.clientY};c.setPointerCapture(e.pointerId)};c.onpointermove=e=>{if(!drag)return;const dx=e.clientX-last.x,dy=e.clientY-last.y;if(Math.hypot(dx,dy)>2)moved=true;cam.x=target.x-=dx/cam.z;cam.y=target.y-=dy/cam.z;last={x:e.clientX,y:e.clientY}};c.onpointerup=c.onpointercancel=()=>drag=false;c.addEventListener('wheel',e=>{e.preventDefault();const bx=wx(e.clientX),by=wy(e.clientY),z=clamp(cam.z*Math.exp(-e.deltaY*.0013),.14,3);cam.z=target.z=z;cam.x=target.x=bx-(e.clientX-W/2)/z;cam.y=target.y=by-(e.clientY-H/2)/z},{passive:false});c.onclick=e=>{if(moved)return;let best=null,d=26;for(const n of nodes){const q=Math.hypot(sx(n.x)-e.clientX,sy(n.y)-e.clientY);if(q<d){d=q;best=n}}if(best)choose(best)};
</script></body></html>
