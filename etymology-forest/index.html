C.onclick=e=>{if(moved)return;let best=null,bd=28;for(const n of N){const d=Math.hypot(sx(n.x)-e.clientX,sy(n.y)-e.clientY);if(d<bd){bd=d;best=n}}if(best)return select(best);if(cam.z>.75){let b=null,d0=18;for(const n of canopy){if(!inView(n.x,n.y,22))continue;const d=Math.hypot(sx(n.x)-e.clientX,sy(n.y)-e.clientY);if(d<d0){d0=d;b=n}}if(b)return selectC(b)}if(cam.z<.55){let br=null,d0=99;for(const r of regions){const d=Math.hypot((wx(e.clientX)-r.x)/r.rx,(wy(e.clientY)-r.y)/r.ry);if(d<d0){d0=d;br=r}}if(br&&d0<1.2)target={x:br.x,y:br.y,z:.7}}};
