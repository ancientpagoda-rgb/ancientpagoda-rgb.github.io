<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Letter History</title>
    <style>
      :root {
        --bg: #f6f2e9;
        --ink: #1f211c;
        --muted: #666a60;
        --line: #cfc6b6;
        --panel: #fffdf7;
        --green: #2f6b47;
        --red: #9d4d4f;
        --gold: #af7b2d;
        --blue: #3d7087;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        color: var(--ink);
        background:
          linear-gradient(90deg, rgba(47, 107, 71, 0.055) 1px, transparent 1px),
          linear-gradient(rgba(61, 112, 135, 0.05) 1px, transparent 1px),
          var(--bg);
        background-size: 44px 44px;
      }

      .app {
        min-height: 100vh;
        display: grid;
        grid-template-rows: auto 1fr;
      }

      header {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 20px;
        align-items: end;
        padding: 22px 28px 16px;
        border-bottom: 1px solid rgba(31, 33, 28, 0.12);
        background: rgba(246, 242, 233, 0.9);
        backdrop-filter: blur(12px);
      }

      h1,
      h2 {
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        letter-spacing: 0;
      }

      h1 {
        font-size: 34px;
      }

      h2 {
        font-size: 76px;
        line-height: 0.9;
      }

      .subtitle {
        margin-top: 5px;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.45;
      }

      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        justify-content: flex-end;
      }

      button {
        min-height: 34px;
        border: 1px solid rgba(31, 33, 28, 0.18);
        border-radius: 7px;
        background: var(--panel);
        color: var(--ink);
        padding: 0 11px;
        font: inherit;
        font-size: 13px;
        cursor: pointer;
      }

      button[aria-pressed="true"] {
        color: white;
        background: var(--green);
        border-color: var(--green);
      }

      main {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 390px;
        min-height: 0;
      }

      .map-wrap {
        overflow: auto;
        padding: 22px;
      }

      .map {
        display: block;
        width: 1120px;
        max-width: none;
        height: 1580px;
      }

      .zone {
        opacity: 0.55;
      }

      .zone-label {
        font-size: 13px;
        font-weight: 800;
        fill: rgba(31, 33, 28, 0.72);
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }

      .stage-label {
        font-size: 12px;
        font-weight: 800;
        fill: var(--muted);
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .lineage-row {
        cursor: pointer;
      }

      .lineage-path {
        fill: none;
        stroke: rgba(31, 33, 28, 0.24);
        stroke-width: 1.5;
      }

      .lineage-row.selected .lineage-path {
        stroke: var(--green);
        stroke-width: 3;
      }

      .node {
        fill: rgba(255, 253, 247, 0.92);
        stroke: rgba(31, 33, 28, 0.18);
        stroke-width: 1;
      }

      .lineage-row.selected .node {
        stroke: var(--green);
        stroke-width: 2;
      }

      .node-label {
        font-size: 12px;
        fill: var(--ink);
        text-anchor: middle;
        dominant-baseline: central;
        pointer-events: none;
      }

      .modern-letter {
        font-family: Georgia, "Times New Roman", serif;
        font-size: 34px;
        font-weight: 700;
      }

      .row-letter {
        font-family: Georgia, "Times New Roman", serif;
        font-size: 28px;
        font-weight: 700;
        fill: var(--ink);
        text-anchor: middle;
        dominant-baseline: central;
        pointer-events: none;
      }

      aside {
        border-left: 1px solid rgba(31, 33, 28, 0.12);
        background: rgba(255, 253, 247, 0.9);
        padding: 26px 24px;
        overflow: auto;
      }

      .detail {
        display: grid;
        gap: 18px;
      }

      .eyebrow {
        color: var(--green);
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      p {
        margin: 0;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.55;
      }

      .lineage {
        display: grid;
        gap: 8px;
      }

      .step {
        display: grid;
        grid-template-columns: 28px 1fr;
        gap: 10px;
        align-items: center;
        padding: 9px 10px;
        border: 1px solid rgba(31, 33, 28, 0.12);
        border-radius: 8px;
        background: rgba(246, 242, 233, 0.58);
      }

      .step mark {
        display: grid;
        place-items: center;
        width: 28px;
        height: 28px;
        border-radius: 999px;
        color: white;
        background: var(--green);
        font-size: 12px;
        font-weight: 800;
      }

      .confidence {
        width: fit-content;
        border: 1px solid rgba(47, 107, 71, 0.24);
        border-radius: 999px;
        padding: 5px 9px;
        color: var(--green);
        background: rgba(47, 107, 71, 0.07);
        font-size: 12px;
        font-weight: 700;
      }

      .vine {
        width: 100%;
        height: 88px;
      }

      .vine path {
        fill: none;
        stroke: rgba(47, 107, 71, 0.4);
        stroke-width: 2;
      }

      .vine text {
        font-family: Georgia, "Times New Roman", serif;
        font-size: 15px;
        fill: var(--green);
        letter-spacing: 0;
      }

      @media (max-width: 860px) {
        header {
          grid-template-columns: 1fr;
          padding: 18px;
        }

        .toolbar {
          justify-content: flex-start;
        }

        main {
          grid-template-columns: 1fr;
        }

        .map-wrap {
          padding: 14px;
        }

        .map {
          width: 980px;
          height: 1384px;
        }

        aside {
          border-left: 0;
          border-top: 1px solid rgba(31, 33, 28, 0.12);
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header>
        <div>
          <h1>Letter History</h1>
          <div class="subtitle">
            A garden of Latin letters, their ancestors, splits, borrowings, and returns.
          </div>
        </div>
        <nav class="toolbar" aria-label="Letter filter">
          <button type="button" data-filter="all" aria-pressed="true">All</button>
          <button type="button" data-filter="high" aria-pressed="false">High</button>
          <button type="button" data-filter="medium" aria-pressed="false">Medium</button>
          <button type="button" data-filter="late" aria-pressed="false">Late splits</button>
        </nav>
      </header>
      <main>
        <section class="map-wrap" aria-label="Letter lineage map">
          <svg class="map" id="map" viewBox="0 0 1120 1580" role="img"></svg>
        </section>
        <aside>
          <div class="detail" id="detail"></div>
        </aside>
      </main>
    </div>
    <script>
      const letters = [];
      const raw = {
        "A": ["aleph", "alpha", "Latin A", "Often traced to Semitic aleph, associated with an ox/head sign, through Greek alpha.", "Rotated and abstracted from pictorial origins into a stable triangular capital.", "high"],
        "B": ["beth", "beta", "Latin B", "Traced to Semitic beth, usually glossed as house, through Greek beta.", "The house-like form became rounded in Greek and Latin writing.", "high"],
        "C": ["gimel", "gamma", "Etruscan C", "Latin C", "Latin C descends from a gamma-related form used by Etruscan and Latin scribes.", "Its sound history split: C first covered /g/ and /k/ before G was created.", "high"],
        "D": ["daleth", "delta", "Latin D", "Traced to Semitic daleth, usually glossed as door, through Greek delta.", "A triangular delta line became the rounded Latin D.", "high"],
        "E": ["he", "epsilon", "Latin E", "Traced to Semitic he through Greek epsilon.", "Greek vowel adaptation helped turn a consonantal Semitic sign into a vowel letter.", "high"],
        "F": ["waw", "digamma", "Etruscan F", "Latin F", "Latin F is tied to waw/digamma pathways through Greek and Etruscan forms.", "A sign connected with /w/ became Latin /f/ through Etruscan adaptation.", "medium"],
        "G": ["gimel", "gamma", "Latin C", "Latin G", "G was created in Latin as a modified C to distinguish /g/ from /k/.", "A stroke turned C into a new letter species.", "high"],
        "H": ["heth/he", "eta", "Latin H", "H descends through Greek eta/related forms, with sound values shifting across languages.", "A consonant sign became a vowel in some Greek dialects but remained H-like in Latin.", "medium"],
        "I": ["yod", "iota", "Latin I", "Traced to Semitic yod through Greek iota.", "A small linear mark became both vowel I and, later, the ancestor of J.", "high"],
        "J": ["yod", "iota", "Latin I", "J", "J is a later differentiated form of I.", "A swash or terminal variant of I became a separate letter.", "high"],
        "K": ["kaph", "kappa", "Latin K", "Traced to Semitic kaph through Greek kappa.", "Kept a recognizable angled skeleton while losing most pictorial meaning.", "high"],
        "L": ["lamed", "lambda", "Latin L", "Traced to Semitic lamed through Greek lambda.", "A more complex early sign became a simple right angle in Latin capitals.", "high"],
        "M": ["mem", "mu", "Latin M", "Traced to Semitic mem, usually associated with water, through Greek mu.", "Wave-like ancestry stabilized into angular strokes.", "high"],
        "N": ["nun", "nu", "Latin N", "Traced to Semitic nun through Greek nu.", "A serpentine/linear ancestor became a diagonal bridge between vertical stems.", "high"],
        "O": ["ayin", "omicron", "Latin O", "Traced to Semitic ayin, often glossed as eye, through Greek omicron.", "A pictorial eye became one of the most stable circular letters.", "high"],
        "P": ["pe", "pi", "Latin P", "Traced to Semitic pe through Greek pi.", "The form changed strongly across scripts before stabilizing as Latin P.", "high"],
        "Q": ["qoph", "qoppa", "Latin Q", "Traced to Semitic qoph through Greek qoppa and Italic use.", "A marginal Greek letter survived strongly in Latin as Q.", "high"],
        "R": ["resh", "rho", "Latin R", "Traced to Semitic resh through Greek rho.", "Latin added a leg to distinguish R from P-like forms.", "high"],
        "S": ["shin/samekh", "sigma", "Latin S", "Latin S comes through Greek sigma, with deeper Semitic ancestry debated in details.", "Angular zigzags softened into the familiar curve.", "medium"],
        "T": ["taw", "tau", "Latin T", "Traced to Semitic taw through Greek tau.", "A mark/cross sign became the simple vertical-and-bar capital.", "high"],
        "U": ["waw", "upsilon", "Latin V", "U", "U differentiated from V much later in Latin-script history.", "A rounded variant separated vowel U from consonantal V.", "high"],
        "V": ["waw", "upsilon", "Latin V", "V belongs to the waw/upsilon family and originally covered vowel and consonant values.", "A single Latin V later split into U, V, and helped produce W.", "high"],
        "W": ["waw", "Latin V", "double V", "W", "W is a later doubled form of V/U used for Germanic sounds.", "Two V forms fused into a new letter.", "high"],
        "X": ["samekh/chi/xi pathways", "Greek X/Chi", "Latin X", "X has a more tangled route through Greek and Italic letter values.", "A crossed form became fixed as Latin X with /ks/ value.", "medium"],
        "Y": ["waw", "upsilon", "Greek Y", "Latin Y", "Y was borrowed into Latin from Greek upsilon for Greek loanwords.", "A Greek vowel sign became a Latin scholarly/import letter.", "high"],
        "Z": ["zayin", "zeta", "Latin Z", "Z descends from zayin/zeta and was removed then later restored in Latin usage.", "A letter can go dormant in one alphabet and return through borrowing.", "high"]
      };

      for (const [letter, values] of Object.entries(raw)) {
        const confidence = values.at(-1);
        const mutation = values.at(-2);
        const origin = values.at(-3);
        const lineage = values.slice(0, -3);
        const late = ["J", "U", "W", "Y", "Z", "G"].includes(letter);
        letters.push({ letter, lineage, origin, mutation, confidence, late });
      }

      let selected = "A";
      let filter = "all";
      const mapEl = document.querySelector("#map");
      const detailEl = document.querySelector("#detail");
      const xs = [140, 335, 530, 725, 920];

      function visible(item) {
        return (
          filter === "all" ||
          item.confidence === filter ||
          (filter === "late" && item.late)
        );
      }

      function render() {
        mapEl.innerHTML = `
          <rect class="zone" x="92" y="40" width="160" height="1480" rx="36" fill="#f3c6a8"></rect>
          <rect class="zone" x="285" y="40" width="160" height="1480" rx="36" fill="#d9e8b7"></rect>
          <rect class="zone" x="480" y="40" width="190" height="1480" rx="36" fill="#cddff0"></rect>
          <rect class="zone" x="690" y="40" width="320" height="1480" rx="36" fill="#ead0e9"></rect>
          <text class="zone-label" x="115" y="32">Semitic roots</text>
          <text class="zone-label" x="314" y="32">Greek</text>
          <text class="zone-label" x="502" y="32">Italic / Latin</text>
          <text class="zone-label" x="748" y="32">Modern letterforms</text>
          <text class="stage-label" x="38" y="72">Letter</text>
        `;
        for (const [index, item] of letters.entries()) {
          const y = 105 + index * 55;
          const steps = [...item.lineage, item.letter];
          const points = steps.map((_, stepIndex) => [xs[stepIndex], y]);
          const d = points
            .map(([x, py], pointIndex) => `${pointIndex === 0 ? "M" : "L"} ${x} ${py}`)
            .join(" ");
          const row = document.createElementNS("http://www.w3.org/2000/svg", "g");
          row.setAttribute("class", `lineage-row ${item.letter === selected ? "selected" : ""}`);
          row.setAttribute("opacity", visible(item) ? "1" : "0.22");
          row.setAttribute("tabindex", "0");
          row.setAttribute("role", "button");
          row.setAttribute("aria-label", item.letter);
          row.innerHTML = `
            <text class="row-letter" x="42" y="${y}">${item.letter}</text>
            <path class="lineage-path" d="${d}"></path>
            ${steps
              .map((step, stepIndex) => {
                const x = xs[stepIndex];
                const modern = stepIndex === steps.length - 1;
                const label = modern ? item.letter : step;
                const width = modern ? 58 : Math.max(86, Math.min(154, label.length * 7 + 28));
                return `
                  <rect class="node" x="${x - width / 2}" y="${y - 18}" width="${width}" height="36" rx="18"></rect>
                  <text class="node-label ${modern ? "modern-letter" : ""}" x="${x}" y="${y}">${label}</text>
                `;
              })
              .join("")}
          `;
          row.addEventListener("click", () => {
            selected = item.letter;
            render();
          });
          row.addEventListener("keydown", (event) => {
            if (event.key === "Enter" || event.key === " ") {
              selected = item.letter;
              render();
            }
          });
          mapEl.append(row);
        }
        renderDetail(letters.find((item) => item.letter === selected));
      }

      function renderDetail(item) {
        detailEl.innerHTML = `
          <div>
            <div class="eyebrow">letter / ${item.confidence} confidence</div>
            <h2>${item.letter}</h2>
          </div>
          <svg class="vine" viewBox="0 0 360 88" aria-hidden="true">
            <defs>
              <path id="vine-path" d="M10,70 C85,18 150,84 215,38 C262,6 310,24 350,10" />
            </defs>
            <path d="M10,70 C85,18 150,84 215,38 C262,6 310,24 350,10"></path>
            <text><textPath href="#vine-path">${item.lineage.join(" -> ")}</textPath></text>
          </svg>
          <div class="lineage">
            ${item.lineage.map((step, index) => `<div class="step"><mark>${index + 1}</mark><span>${step}</span></div>`).join("")}
          </div>
          <p>${item.origin}</p>
          <p>${item.mutation}</p>
          <div class="confidence">${item.confidence} confidence</div>
        `;
      }

      document.querySelectorAll("[data-filter]").forEach((button) => {
        button.addEventListener("click", () => {
          filter = button.dataset.filter;
          document.querySelectorAll("[data-filter]").forEach((item) => {
            item.setAttribute("aria-pressed", String(item === button));
          });
          render();
        });
      });

      render();
    </script>
  </body>
</html>
